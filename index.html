<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard Preventa Pehuenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#0A1A3A;--azul2:#13295A;--azul3:#1C3670;--claro:#7FC4FF;--blanco:#fff;--tinta:#1F2328;--gris:#6B7280;--linea:#E5E7EB;--verde:#1B7F3B;--ambar:#B45309}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--azul);color:var(--blanco);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 48px}
.wrap.ancho{max-width:1100px}
h1{margin:0 0 8px;padding:14px 20px;border:3px solid var(--blanco);border-radius:12px;font-size:clamp(1.25rem,4vw,1.9rem);font-weight:900;letter-spacing:.02em;text-align:center}
.sub{margin:0 0 18px;text-align:center;font-size:.9rem;color:#D5E4FF}
.listas{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 22px}
.listas button{font:inherit;font-size:.9rem;cursor:pointer;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:7px 14px}
.listas button small{color:#B9CCF0;margin-left:4px}
.listas button[aria-pressed=true]{background:#fff;color:var(--azul);border-color:#fff;font-weight:700}
.listas button[aria-pressed=true] small{color:var(--gris)}
details{margin:0 0 14px;border:2px solid rgba(255,255,255,.55);border-radius:12px;background:var(--azul2);overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;font-size:1.15rem;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;font-weight:500;line-height:1}
details[open] summary::after{content:"−"}
summary .cnt{margin-left:auto;font-size:.85rem;font-weight:500;color:#B9CCF0}
:focus-visible{outline:3px solid var(--claro);outline-offset:2px}
.grupo{padding:0 12px 12px}
.grupo h3{margin:6px 6px 10px;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--claro)}
.grupo h3+.tarjetas{margin-bottom:14px}
.tarjetas{display:grid;gap:10px}
.tarjetas.dos{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
a.card{display:flex;flex-direction:column;gap:5px;padding:16px 20px;border-radius:12px;background:#fff;color:var(--tinta);text-decoration:none;border:1px solid var(--linea);box-shadow:0 1px 3px rgba(0,0,0,.12)}
a.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.25)}
a.card b{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px}
a.card span{font-size:.9rem;color:var(--gris)}
i.dot{display:inline-block;width:.8em;height:.8em;border-radius:3px;flex:none}
footer{margin-top:28px;text-align:center;font-size:.8rem;color:#C2D6FF}
/* paginas internas */
.volver{display:inline-flex;align-items:center;gap:6px;color:#D5E4FF;text-decoration:none;font-size:.95rem;margin:0 0 14px}
.volver:hover{color:#fff}
.hoja{background:#fff;color:var(--tinta);border-radius:14px;padding:18px 18px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hoja h2{margin:0 0 4px;font-size:1.2rem;font-weight:900;letter-spacing:.01em}
.hoja .meta{margin:0 0 14px;color:var(--gris);font-size:.88rem}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.barra input,.barra select{font:inherit;font-size:.95rem;padding:9px 12px;border:1px solid #CBD2DC;border-radius:10px;min-width:0}
.barra input{flex:1 1 220px}
.barra select{flex:0 1 220px;background:#fff}
.btn{font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--azul2);color:#fff;white-space:nowrap}
.btn:hover{background:var(--azul3)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{position:sticky;top:0;background:var(--azul);color:#fff;text-align:left;font-weight:700;font-size:.8rem;padding:9px 8px;letter-spacing:.02em}
th.n,td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td{padding:8px;border-bottom:1px solid #EEF0F3;vertical-align:top;overflow-wrap:anywhere}
.pc .nom,.promo li{overflow-wrap:anywhere}
td.cod{color:var(--gris);font-size:.82rem;white-space:nowrap}
tr.sep td{background:#F1F5FB;color:var(--azul2);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 8px}
td .tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.tag.top{background:#FFF4D6;color:#8A5A00}
.tag.desc{background:#E3F4E8;color:var(--verde)}
.tag.combo{background:#EDE7F6;color:#5B2BA6}
.vacio{padding:20px;text-align:center;color:var(--gris)}
.prov-chip{font-size:.78rem;color:var(--gris);display:block}
/* catalogo */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{font:inherit;font-size:.82rem;cursor:pointer;border:1px solid #CBD2DC;background:#fff;color:var(--tinta);border-radius:999px;padding:5px 11px}
.chips button[aria-pressed=true]{background:var(--azul2);border-color:var(--azul2);color:#fff}
.cat-sec h4{margin:16px 2px 10px;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--azul2);border-bottom:2px solid var(--azul2);padding-bottom:4px}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pc{border:1px solid var(--linea);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff;position:relative}
.pc .ini{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.95rem;flex:none}
.pc .cab{display:flex;gap:10px;align-items:flex-start}
.pc .nom{font-weight:700;font-size:.92rem;line-height:1.25}
.pc .cod{font-size:.78rem;color:var(--gris)}
.pc .precios{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.pc .precios div{background:#F5F7FA;border-radius:8px;padding:6px 8px}
.pc .precios small{display:block;font-size:.7rem;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.pc .precios b{font-size:.98rem;font-variant-numeric:tabular-nums}
.pc .tags{display:flex;flex-wrap:wrap;gap:4px}
/* descuentos */
.dsec{margin:0 0 18px}
.dsec>h3{margin:0 0 4px;font-size:1rem}
.dsec>p{margin:0 0 10px;color:var(--gris);font-size:.88rem}
.promo{border:1px solid var(--linea);border-left:5px solid var(--azul2);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.promo .t{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.promo .t small{font-weight:400;color:var(--gris)}
.escala{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.escala span{background:#E3F4E8;color:var(--verde);font-weight:700;font-size:.85rem;border-radius:7px;padding:3px 8px}
.promo .det{font-size:.85rem;color:#3B4250;margin-top:4px}
.promo ul{margin:4px 0 0;padding-left:18px;font-size:.84rem;color:#3B4250}
.promo ul li+li{margin-top:2px}
.leyenda{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px;font-size:.85rem;color:var(--gris)}
@media (max-width:560px){
  .wrap{padding:18px 12px 40px}
  .hoja{padding:14px 10px 6px;border-radius:12px}
  table{font-size:.84rem}
  th.n,td.n{font-size:.8rem}
  td,th{padding:7px 5px}
  th.ub,td.ub{display:none}
  td.cod{display:none}th.cod{display:none}
  td .codm{display:block;color:var(--gris);font-size:.75rem}
}
@media (min-width:561px){td .codm{display:none}}
</style>
</head>

const fecha = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '';
const miles = n => n.toLocaleString('es-AR');
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

let L = '1';
try { const g = localStorage.getItem('lista'); if (g && D.pr[g]) L = g; } catch (e) {}

// --- indices ---
const ART = {}; D.arts.forEach(a => ART[a[0]] = a);
const provOrden = Object.keys(D.prov).sort((x, y) => D.prov[y].u - D.prov[x].u);
// top 10 mas vendidos de cada proveedor
const TOP = new Set();
provOrden.forEach(p => D.arts.filter(a => a[2] === p && a[5] > 0).sort((x, y) => y[5] - x[5]).slice(0, 10).forEach(a => TOP.add(a[0])));

function aplicaLista(lp, l) {
  if (!lp) return true;
  const m = lp.match(/todas menos (.*)/);
  if (m) return !m[1].split(',').map(s => s.trim()).includes(l);
  return lp.split(',').map(s => s.trim()).includes(l);
}
function tipoPromo(p) {
  if (p.et) return 'cliente';
  if (p.ti.length || p.cli) return 'especial';
  if (p.ar.length || p.na || p.rub.length) return 'articulo';
  if (p.pv.length) return 'proveedor';
  return 'especial';
}
// marcas de descuento / combo por articulo (para la lista seleccionada)
function marcas() {
  const desc = new Set(), combo = new Set();
  D.promos.forEach(p => {
    if (!aplicaLista(p.lp, L)) return;
    const t = tipoPromo(p);
    if (t === 'proveedor') D.arts.forEach(a => { if (p.pv.includes(a[2])) desc.add(a[0]); });
    if (t === 'articulo') p.ar.forEach(a => (/combo/i.test(p.n) ? combo : desc).add(a));
  });
  if (L === '1') D.combos.forEach(c => c.p.forEach(x => x.a.forEach(a => combo.add(a))));
  return {desc, combo};
}
function tags(cod, M, top = true) {
  let h = '';
  if (top && TOP.has(cod)) h += '<span class="tag top">Más vendido</span>';
  if (M.desc.has(cod)) h += '<span class="tag desc">Desc. x cant.</span>';
  if (M.combo.has(cod)) h += '<span class="tag combo">Combo</span>';
  return h;
}
function artsDe(p, emp) {
  return D.arts.filter(a => (p === 'todas' || a[2] === p) && (!emp || a[4] === emp) && D.pr[L][a[0]])
    .sort((x, y) => x[3].localeCompare(y[3], 'es') || x[1].localeCompare(y[1], 'es'));
}
function ultCambio(lista) { return lista.map(a => D.pr[L][a[0]][3]).sort().pop(); }
function provNombre(p) { return D.prov[p] ? D.prov[p].n : p; }
const dot = p => `<i class="dot" style="background:#${D.prov[p].c}"></i>`;

// --- selector de lista ---
function pintarListas() {
  $('#listas').innerHTML = Object.keys(D.pr).filter(l => Object.keys(D.pr[l]).length).map(l =>
    `<button type="button" data-l="${l}" aria-pressed="${l === L}">Lista ${l}<small>${D.clientes[l] ? miles(D.clientes[l]) + ' clientes' : ''}</small></button>`).join('');
}
$('#listas').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  L = b.dataset.l; try { localStorage.setItem('lista', L); } catch (e) {}
  pintarListas(); render();
});

// --- portada ---
function portada() {
  const abiertos = (() => { try { return JSON.parse(localStorage.getItem('abiertos') || '{}'); } catch (e) { return {}; } })();
  const op = k => abiertos[k] === false ? '' : ' open';
  const M = marcas();
  const catCards = provOrden.filter(p => artsDe(p).length >= 3).map(p => {
    const ls = artsDe(p); const lin = [...new Set(ls.map(a => a[3]))].filter(x => x !== 'Otros');
    return `<a class="card" href="#catalogo/${p}"><b>${dot(p)}Catálogo ${esc(provNombre(p))}</b><span>${lin.length ? esc(lin.slice(0, 5).join(', ')) + (lin.length > 5 ? ' y más' : '') + ' · ' : ''}${ls.length} productos</span></a>`;
  }).join('');
  const listaCards = emp => provOrden.filter(p => artsDe(p, emp).length).map(p => {
    const ls = artsDe(p, emp);
    return `<a class="card" href="#lista/${p}${D.prov[p].e['1'] && D.prov[p].e['3'] ? '/' + emp : ''}"><b>${dot(p)}Lista de precios ${esc(provNombre(p))}</b><span>Último cambio ${fecha(ultCambio(ls))} · ${ls.length} productos</span></a>`;
  }).join('');
  const nPromos = D.promos.filter(p => aplicaLista(p.lp, L)).length + (L === '1' ? D.combos.length : 0);
  $('#app').innerHTML = `
  <details data-k="cat"${op('cat')}><summary>Catálogos<span class="cnt">${provOrden.filter(p => artsDe(p).length >= 3).length}</span></summary>
    <div class="grupo"><div class="tarjetas dos">${catCards}</div></div></details>
  <details data-k="lis"${op('lis')}><summary>Listas de precios<span class="cnt">Lista ${L} · con IVA</span></summary>
    <div class="grupo">
      <div class="tarjetas" style="margin-bottom:14px"><a class="card" href="#lista/todas"><b>Todas las listas de precios</b><span>Lista ${L} con IVA: precio por bulto y por unidad, con buscador y Excel</span></a></div>
      <h3>Pehuenia</h3><div class="tarjetas dos">${listaCards('1')}</div>
      <h3>Comercializadora</h3><div class="tarjetas dos">${listaCards('3')}</div>
    </div></details>
  <details data-k="des"${op('des')}><summary>Descuentos y dinámicas<span class="cnt">${nPromos} vigentes</span></summary>
    <div class="grupo"><div class="tarjetas"><a class="card" href="#descuentos"><b>Descuentos y dinámicas vigentes</b><span>Escalas por cantidad de cada proveedor, combos de Pepsico y P&amp;G, descuentos por cliente y mayoristas: lo que está cargado en Gescom para la Lista ${L}</span></a></div></div></details>`;
  document.querySelectorAll('details[data-k]').forEach(dt => dt.addEventListener('toggle', () => {
    abiertos[dt.dataset.k] = dt.open; try { localStorage.setItem('abiertos', JSON.stringify(abiertos)); } catch (e) {}
  }));
}

// --- lista de precios ---
function paginaLista(p, emp) {
  const todas = p === 'todas';
  const titulo = todas ? 'Todas las listas de precios' : 'Lista de precios ' + provNombre(p) + (emp ? ' · ' + D.empresas[emp] : '');
  const opProv = todas ? `<select id="fprov" aria-label="Proveedor"><option value="">Todos los proveedores</option>${provOrden.map(x => `<option value="${x}">${esc(provNombre(x))}</option>`).join('')}</select>` : '';
  $('#app').innerHTML = `<a class="volver" href="#">← Volver al inicio</a>
  <div class="hoja"><h2>${esc(titulo.toUpperCase())}</h2>
  <p class="meta" id="meta"></p>
  <div class="barra"><input id="q" type="search" placeholder="Buscar por producto o código…" autocomplete="off">${opProv}<button class="btn" id="xls">⬇ Excel</button></div>
  <table><thead><tr><th class="cod">Código</th><th>Producto</th><th class="n ub">Un./bulto</th><th class="n">Precio bulto</th><th class="n">Precio unidad</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const M = marcas();
  const pintar = () => {
    const q = norm($('#q').value.trim()); const fp = todas ? $('#fprov').value : '';
    const ls = artsDe(todas ? (fp || 'todas') : p, emp).filter(a => !q || norm(a[1] + ' ' + a[0] + ' ' + a[3]).includes(q));
    if (todas && !fp) ls.sort((x, y) => provOrden.indexOf(x[2]) - provOrden.indexOf(y[2]) || x[3].localeCompare(y[3], 'es') || x[1].localeCompare(y[1], 'es'));
    let h = '', grp = '';
    for (const a of ls) {
      const g = (todas && !fp ? provNombre(a[2]) + ' · ' : '') + a[3];
      if (g !== grp) { grp = g; h += `<tr class="sep"><td colspan="5">${esc(g)}</td></tr>`; }
      const [pu, pb, ub] = D.pr[L][a[0]];
      h += `<tr><td class="cod">${a[0]}</td><td>${esc(a[1])}<span class="tags">${tags(a[0], M)}</span><span class="codm">Cód. ${a[0]}${ub ? ' · bulto x' + ub : ''}</span></td><td class="n ub">${ub || ''}</td><td class="n">${fmt(pb)}</td><td class="n"><b>${fmt(pu)}</b></td></tr>`;
    }
    $('#tb').innerHTML = h || '<tr><td colspan="5" class="vacio">No hay productos con ese filtro.</td></tr>';
    $('#meta').textContent = `Lista ${L} · precios con IVA incluido · ${ls.length} productos · último cambio ${fecha(ultCambio(ls.length ? ls : artsDe('todas')))}`;
    return ls;
  };
  $('#q').addEventListener('input', pintar);
  if (todas) $('#fprov').addEventListener('change', pintar);
  $('#xls').addEventListener('click', () => excel(pintar(), titulo));
  pintar();
}

function excel(ls, titulo) {
  if (!window.XLSX) { alert('El Excel todavía está cargando, probá de nuevo en un segundo.'); return; }
  const filas = [[titulo.toUpperCase() + ' (LISTA ' + L + ' - PRECIOS CON IVA)'], ['Datos de Gescom al ' + fecha(D.bajado)], [],
    ['Código', 'Producto', 'Proveedor', 'Línea', 'Unidades por bulto', 'Precio por bulto', 'Precio por unidad']];
  ls.forEach(a => { const [pu, pb, ub] = D.pr[L][a[0]]; filas.push([+a[0] || a[0], a[1], provNombre(a[2]), a[3], ub || '', pb || '', pu]); });
  const ws = XLSX.utils.aoa_to_sheet(filas);
  ws['!cols'] = [{wch: 11}, {wch: 46}, {wch: 18}, {wch: 20}, {wch: 10}, {wch: 15}, {wch: 15}];
  for (let r = 4; r < filas.length; r++) for (const c of ['F', 'G']) { const cell = ws[c + (r + 1)]; if (cell && typeof cell.v === 'number') cell.z = '"$" #,##0.00'; }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Lista ' + L);
  XLSX.writeFile(wb, (titulo + ' Lista ' + L).replace(/[^\wñÑáéíóú &·.-]/g, '').replace(/\s+/g, ' ') + '.xlsx');
}

// --- catalogo ---
function paginaCatalogo(p) {
  const M = marcas(); const ls = artsDe(p);
  const lin = [...new Set(ls.map(a => a[3]))];
  $('#app').innerHTML = `<a class="volver" href="#">← Volver al inicio</a>
  <div class="hoja"><h2>CATÁLOGO ${esc(provNombre(p).toUpperCase())}</h2>
  <p class="meta">Lista ${L} · precios con IVA · ${ls.length} productos · último cambio ${fecha(ultCambio(ls))} · <a href="#lista/${p}">ver como lista</a></p>
  <div class="barra"><input id="q" type="search" placeholder="Buscar en el catálogo…" autocomplete="off"></div>
  ${lin.length > 1 ? `<div class="chips" id="chips"><button type="button" data-v="" aria-pressed="true">Todo</button><button type="button" data-v="__top" aria-pressed="false">★ Más vendidos</button>${lin.map(x => `<button type="button" data-v="${esc(x)}" aria-pressed="false">${esc(x)}</button>`).join('')}</div>` : ''}
  <div id="cat"></div></div>`;
  let fil = '';
  const pintar = () => {
    const q = norm($('#q').value.trim());
    const v = ls.filter(a => (!fil || (fil === '__top' ? TOP.has(a[0]) : a[3] === fil)) && (!q || norm(a[1] + ' ' + a[0]).includes(q)));
    if (fil === '__top') v.sort((x, y) => y[5] - x[5]);
    const grupos = fil === '__top' ? [['Más vendidos desde agosto', v]] : lin.map(g => [g, v.filter(a => a[3] === g)]).filter(g => g[1].length);
    $('#cat').innerHTML = grupos.map(([g, xs]) => `<section class="cat-sec"><h4>${esc(g)}</h4><div class="prod">${xs.map(a => {
      const [pu, pb, ub] = D.pr[L][a[0]];
      const ini = a[1].replace(/^(PH|PG|P&G)\s+/i, '').trim().slice(0, 2).toUpperCase();
      return `<div class="pc"><div class="cab"><div class="ini" style="background:#${D.prov[p].c}">${esc(ini)}</div><div><div class="nom">${esc(a[1])}</div><div class="cod">Cód. ${a[0]}${ub ? ' · bulto x' + ub : ''}</div></div></div>
        <div class="tags">${tags(a[0], M)}</div>
        <div class="precios">${pb ? `<div><small>Bulto</small><b>${fmt(pb)}</b></div>` : ''}<div${pb ? '' : ' style="grid-column:1/-1"'}><small>Unidad</small><b>${fmt(pu)}</b></div></div></div>`;
    }).join('')}</div></section>`).join('') || '<p class="vacio">No hay productos con ese filtro.</p>';
  };
  $('#q').addEventListener('input', pintar);
  const ch = $('#chips');
  if (ch) ch.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; fil = b.dataset.v;
    ch.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    pintar();
  });
  pintar();
}

// --- descuentos ---
function escala(b) {
  const m = [...b.matchAll(/desde ([\d.,]+) ([\d.,]+%)/g)];
  if (m.length) return '<div class="escala">' + m.map(x => `<span>desde ${x[1]} → ${x[2]}</span>`).join('') + '</div>';
  return `<div class="escala"><span>${esc(b.replace(/(\d{5,})/g, c => ART[c] ? ART[c][1] : c))}</span></div>`;
}
const listaArts = (cods, max = 8) => {
  const xs = cods.filter(c => ART[c]);
  if (!xs.length) return '';
  return '<ul>' + xs.slice(0, max).map(c => `<li>${esc(ART[c][1])}${ART[c][1].includes(c) ? '' : ` <span style="color:#6B7280">(${c})</span>`}</li>`).join('') + (xs.length > max ? `<li>y ${xs.length - max} ${xs.length - max === 1 ? 'producto' : 'productos'} más</li>` : '') + '</ul>';
};
const vence = h => h && h < '2027-06-01' ? ` <small>· vence ${fecha(h)}</small>` : '';
const aQuien = p => p.sr.length ? `<div class="det">Para: ${esc([...new Set(p.sr)].join(', '))}</div>` : '';
function paginaDescuentos() {
  const ps = D.promos.filter(p => aplicaLista(p.lp, L));
  const por = t => ps.filter(p => tipoPromo(p) === t);
  // por proveedor, agrupadas
  const prov = por('proveedor');
  const provHtml = provOrden.concat(Object.keys(D.prov).filter(x => !provOrden.includes(x))).map(pv => {
    const xs = prov.filter(p => p.pv.includes(pv)); if (!xs.length) return '';
    return xs.map(p => `<div class="promo" style="border-left-color:#${D.prov[pv].c}"><div class="t">${esc(provNombre(pv))} <small>${esc(p.n)}${vence(p.h)}</small></div>${escala(p.b)}<div class="det">Sale automático en Gescom si se respetan las cantidades.</div></div>`).join('');
  }).join('') + prov.filter(p => !p.pv.some(x => D.prov[x])).map(p => {
    const nom = p.pv.map(x => D.pnPromo[x]).filter(Boolean).join(', ');
    return `<div class="promo"><div class="t">${esc(nom || p.n)} <small>${nom ? esc(p.n) : ''}${vence(p.h)}</small></div>${escala(p.b)}<div class="det">Proveedor sin ventas desde agosto: no figura en las listas.</div></div>`;
  }).join('');
  const artHtml = por('articulo').sort((a, b) => (a.h || '').localeCompare(b.h || '')).map(p => {
    const pv = p.pv.find(x => D.prov[x]);
    return `<div class="promo"${pv ? ` style="border-left-color:#${D.prov[pv].c}"` : ''}><div class="t">${esc(p.n)} <small>${pv ? esc(provNombre(pv)) : ''}${vence(p.h)}</small></div>${escala(p.b)}${p.rub.length ? `<div class="det">Rubros: ${esc(p.rub.join(', '))}</div>` : ''}${p.min > 1 ? `<div class="det">Mínimo ${p.min} unidades.</div>` : ''}${aQuien(p)}${p.ar.length ? listaArts(p.ar) : '<div class="det">Productos sin ventas desde agosto (no figuran en las listas).</div>'}</div>`;
  }).join('');
  const comboHtml = L !== '1' ? '' : D.combos.map(c => {
    const pv = c.pv.find(x => D.prov[x]);
    const partes = c.p.map(x => `<span${x.d >= 1 ? '' : ' style="background:#EEF2F8;color:#13295A"'}>${x.d >= 1 ? x.q + (x.q === 1 ? ' bonificado' : ' bonificados') : x.d > 0 ? x.q + ' con ' + Math.round(x.d * 100) + '%' : 'llevando ' + x.q}: ${esc(x.n)}</span>`).join('');
    return `<div class="promo"${pv ? ` style="border-left-color:#${D.prov[pv].c}"` : ''}><div class="t">${esc(c.n)} <small>${pv ? esc(provNombre(pv)) : ''} · combo ${c.id}${c.seg ? ' · taxonomías ' + esc(c.seg) : ''}</small></div><div class="escala">${partes}</div>${c.sr.length ? `<div class="det">Para: ${esc([...new Set(c.sr)].join(', '))}</div>` : ''}${listaArts([...new Set(c.p.flatMap(x => x.a))], 6)}</div>`;
  }).join('');
  const cli = por('cliente').map(p => `<div class="promo"><div class="t">${esc(p.n)}</div>${escala(p.b)}<div class="det">Clientes con etiqueta ${esc(p.et.split(',').join(' / '))} en Gescom.</div></div>`).join('');
  const esp = por('especial').map(p => {
    const det = [p.ti.length ? 'Productos con etiqueta ' + [...new Set(p.ti)].join(' / ') + ' en Gescom' : '', p.cli ? (p.cli === 1 ? 'Un cliente puntual' : p.cli + ' clientes puntuales') : '', /mayorista/i.test(p.n) ? 'Lista de mayoristas' : ''].filter(Boolean).join(' · ');
    return `<div class="promo"><div class="t">${esc(p.n)}${vence(p.h)}</div>${escala(p.b)}${det ? `<div class="det">${esc(det)}.</div>` : ''}</div>`;
  }).join('');
  const sec = (t, sub, h) => h ? `<section class="dsec"><h3>${t}</h3><p>${sub}</p>${h}</section>` : '';
  $('#app').innerHTML = `<a class="volver" href="#">← Volver al inicio</a>
  <div class="hoja"><h2>DESCUENTOS Y DINÁMICAS VIGENTES</h2>
  <p class="meta">Lista ${L} · lo que está cargado en Gescom al ${fecha(D.bajado)} · se actualiza solo</p>
  ${sec('Descuentos por cantidad, por proveedor', 'Escalas que aplica Gescom solo al cargar el pedido.', provHtml)}
  ${sec('Combos', 'Combos activos en Gescom: la parte bonificada sale sin cargo.', comboHtml)}
  ${sec('Dinámicas por producto', 'Descuentos sobre productos puntuales, algunas solo para ciertos canales.', artHtml)}
  ${sec('Descuentos por cliente', 'Dependen de la etiqueta del cliente en Gescom.', cli)}
  ${sec('Especiales y mayoristas', 'Frescura, acuerdos puntuales y escalas de mayoristas.', esp)}
  ${!provHtml && !comboHtml && !artHtml && !cli && !esp ? '<p class="vacio">No hay descuentos cargados para esta lista.</p>' : ''}
  </div>`;
}

// --- router ---
function render() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [r, a, b] = h.split('/');
  $('#wrap').classList.toggle('ancho', r === 'catalogo' || r === 'lista');
  if (r === 'lista' && (a === 'todas' || D.prov[a])) paginaLista(a, b && D.empresas[b] ? b : '');
  else if (r === 'catalogo' && D.prov[a]) paginaCatalogo(a);
  else if (r === 'descuentos') paginaDescuentos();
  else portada();
  document.title = r === 'lista' ? 'Listas de precios · Pehuenia' : r === 'catalogo' ? 'Catálogo ' + provNombre(a) : r === 'descuentos' ? 'Descuentos · Pehuenia' : 'Dashboard Preventa Pehuenia';
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
$('#pie').textContent = 'Datos de la base de Gescom · actualizado ' + new Date(D.bajado).toLocaleString('es-AR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) + ' · artículos vendidos desde el ' + fecha(D.desde);
pintarListas(); render();
</script>
</body>
</html>
